<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora Umbral</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#f2f5fb;min-height:100vh}
.app{position:relative;overflow:hidden;min-height:100vh}
.topbar{background:#003087;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 1.25rem;position:sticky;top:0;z-index:20}
.topbar-title{font-family:'Playfair Display',Georgia,serif;font-size:16px;font-weight:700;color:#fff}
.hamburger{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;gap:5px;padding:4px}
.hamburger span{display:block;width:22px;height:2px;background:#fff;border-radius:2px;transition:all .3s}
.hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.hamburger.open span:nth-child(2){opacity:0}
.hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.sidebar{position:fixed;top:0;left:-280px;width:260px;height:100%;background:#003087;z-index:30;transition:left .3s ease;padding-top:52px;box-shadow:4px 0 20px rgba(0,0,0,0.2)}
.sidebar.open{left:0}
.sidebar-item{display:flex;align-items:center;gap:12px;padding:16px 24px;color:rgba(255,255,255,0.8);font-size:15px;cursor:pointer;border-left:3px solid transparent;transition:all .2s}
.sidebar-item:hover,.sidebar-item.active{color:#fff;background:rgba(255,255,255,0.08);border-left-color:#c8a951}
.sidebar-divider{height:1px;background:rgba(255,255,255,0.1);margin:8px 16px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:25;display:none}
.overlay.show{display:block}
.page{display:none;padding:1.5rem 1.25rem 2rem;animation:fadeIn .3s ease;min-height:calc(100vh - 52px)}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.home-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 120px);text-align:center;gap:1.5rem}
.home-title{font-family:'Playfair Display',Georgia,serif;font-size:32px;font-weight:700;color:#003087}
.home-title em{font-style:normal;color:#c8a951}
.home-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:360px}
.home-card{background:#fff;border:1px solid #d0daea;border-radius:12px;padding:14px 12px;cursor:pointer;text-align:left;transition:border-color .2s,box-shadow .2s;border-top:3px solid #003087}
.home-card:hover{border-color:#003087;box-shadow:0 4px 16px rgba(0,48,135,0.12)}
.home-card .hc-icon{font-size:20px;margin-bottom:6px}
.home-card .hc-title{font-size:13px;font-weight:600;color:#003087}
.home-card .hc-sub{font-size:11px;color:#5a6e8c;margin-top:2px}
.home-card.ext{border-top-color:#c8a951}
.section-title{font-family:'Playfair Display',Georgia,serif;font-size:18px;font-weight:700;color:#003087;margin-bottom:.25rem}
.section-sub{font-size:13px;color:#5a6e8c;margin-bottom:1.25rem}
.card{background:#fff;border:1px solid #d0daea;border-radius:12px;padding:1.25rem;margin-bottom:1rem;box-shadow:0 1px 8px rgba(0,48,135,0.05)}
.card-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#5a6e8c;margin-bottom:.75rem;display:flex;align-items:center;gap:6px}
.card-label::before{content:'';width:3px;height:14px;background:#c8a951;border-radius:2px;display:block}
.grupo-sel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem}
.gb{border:1.5px solid #d0daea;border-radius:8px;padding:10px 6px;background:#f2f5fb;cursor:pointer;text-align:center;font-family:'DM Sans',sans-serif;transition:all .2s}
.gb .gl{font-size:12px;font-weight:600;color:#003087}
.gb .gd{font-size:10px;color:#5a6e8c;margin-top:2px}
.gb.active{border-color:#003087;background:#e8eef7}
.gdesc{font-size:12px;color:#5a6e8c;padding:8px 10px;background:#f2f5fb;border-radius:8px;margin-bottom:1rem;line-height:1.5}
.grade-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;font-weight:600;color:#003087;letter-spacing:.04em;text-transform:uppercase}
.field input{background:#f2f5fb;border:1.5px solid #d0daea;border-radius:8px;padding:9px 12px;font-size:15px;font-family:'DM Sans',sans-serif;font-weight:500;color:#0d1f3c;width:100%;-webkit-appearance:none}
.field input:focus{outline:none;border-color:#1a4ba0;background:#fff}
.field input.err{border-color:#c0392b;background:#fff5f5}
.fh{font-size:10px;color:#c0392b;min-height:13px}
.btn-main{width:100%;padding:13px;background:#003087;color:#fff;font-family:'DM Sans',sans-serif;font-weight:600;font-size:15px;border:none;border-radius:10px;cursor:pointer;margin-top:.75rem;transition:background .2s}
.btn-main:hover{background:#1a4ba0}
.result-hero{background:#003087;border-radius:12px;padding:1.5rem;text-align:center;margin-bottom:1rem}
.rh-label{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#c8a951;margin-bottom:.25rem}
.rh-score{font-family:'Playfair Display',Georgia,serif;font-size:52px;font-weight:700;color:#fff;line-height:1}
.rh-avg{font-size:13px;color:rgba(255,255,255,0.5);margin-top:.25rem}
.bar-hdr{display:flex;justify-content:space-between;font-size:11px;color:#5a6e8c;margin-bottom:4px}
.bar-track{background:#e8eef7;border-radius:100px;height:8px;overflow:hidden}
.bar-fill{height:100%;border-radius:100px;background:#003087;transition:width 1s ease;width:0%}
.pct-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pct-row label{font-size:12px;color:#0d1f3c;flex:1;font-weight:500}
.pct-total{font-size:13px;font-weight:600;padding:8px 12px;border-radius:8px;text-align:center;margin:8px 0}
.pct-ok{background:#e8f5e9;color:#2e7d32}
.pct-err{background:#ffebee;color:#c0392b}
.pond-result{background:#003087;border-radius:12px;padding:1.25rem;text-align:center;margin-top:1rem}
.pond-result .pr-label{font-size:11px;color:#c8a951;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.25rem}
.pond-result .pr-score{font-family:'Playfair Display',Georgia,serif;font-size:48px;font-weight:700;color:#fff;line-height:1}
.footer-bar{background:#003087;padding:1rem 1.25rem;text-align:center;margin-top:1rem}
.footer-bar a{color:rgba(255,255,255,0.6);font-size:12px;text-decoration:none;margin:0 8px}
.footer-bar a:hover{color:#c8a951}
</style>
</head>
